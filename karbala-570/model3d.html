<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خانه کربلا ۵٫۷۰ — مدل سه‌بعدی نما</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#14110e;color:#f3ece2;font-family:Vazirmatn,Tahoma,sans-serif}
model-viewer{width:100%;height:100%;--poster-color:#14110e}
#bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;flex-wrap:wrap;justify-content:center}
#bar button,#bar a{background:#2a2622;color:#f3ece2;border:1px solid #4a443c;border-radius:10px;padding:8px 14px;font:14px Tahoma;cursor:pointer;text-decoration:none}
#bar .on{border-color:#c9a46d;color:#c9a46d}
#hint{position:fixed;bottom:12px;width:100%;text-align:center;font-size:13px;color:#a89c8a}
</style>
</head>
<body>
<div id="bar">
  <button id="day" class="on">روز · Day</button>
  <button id="night">شب · Night</button>
  <button id="front">نمای روبه‌رو · Front</button>
  <a href="index.html">ارائه · Slides</a>
</div>
<model-viewer id="mv" src="model/house.glb" alt="Karbala house 5.70 facade"
  camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1"
  environment-image="neutral" camera-orbit="-25deg 80deg auto" ar ar-modes="webxr scene-viewer quick-look">
</model-viewer>
<div id="hint">چرخش: کشیدن · زوم: دو انگشت / اسکرول · Drag to orbit, pinch/scroll to zoom</div>
<script>
const mv=document.getElementById('mv'),d=document.getElementById('day'),n=document.getElementById('night');
d.onclick=()=>{mv.exposure=1;mv.environmentImage='neutral';document.body.style.background='#14110e';d.classList.add('on');n.classList.remove('on')};
n.onclick=()=>{mv.exposure=0.25;mv.environmentImage='legacy';document.body.style.background='#05070d';n.classList.add('on');d.classList.remove('on')};
document.getElementById('front').onclick=()=>{mv.cameraOrbit='0deg 85deg auto';mv.cameraTarget='auto auto auto'};
</script>
</body>
</html>
